name: content-os

x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-contentos}:${POSTGRES_PASSWORD:-contentos}@db:5432/${POSTGRES_DB:-contentos}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentos}
      POSTGRES_DB: ${POSTGRES_DB:-contentos}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: *database-url
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./migrations
        - action: rebuild
          path: ./uv.lock

volumes:
  pgdata:
