server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # add_header в location не наследуется с уровня server: общие заголовки — в каждом.
    set $nosniff "nosniff";

    # Файлы с хешем в имени не меняются: кэш навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options $nosniff;
        try_files $uri =404;
    }

    # Шрифты и favicon без хеша: кэш на неделю.
    location ~ ^/(fonts/|favicon\.svg$) {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options $nosniff;
        try_files $uri =404;
    }

    # История браузера (createWebHistory): любой путь приложения отдаёт index.html.
    # Его не кэшируем, иначе после деплоя он ссылается на удалённые чанки.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options $nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri /index.html;
    }
}
